name: Daily Commit

on:
  schedule:
    - cron: '0 23 * * *'  # 毎日23時に実行 (UTC) -> 日本時間8時 (JST)
  workflow_dispatch:  # 手動トリガー

jobs:
  daily-commit:
    runs-on: ubuntu-22.04  # 明示的にバージョンを指定

    env:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      COMMIT_USER_NAME: ${{ vars.COMMIT_USER_NAME }}
      COMMIT_USER_EMAIL: ${{ vars.COMMIT_USER_EMAIL }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        repository: ${{ github.repository }}

    - name: Update README.md
      run: |
        echo "Last updated on $(TZ='Asia/Tokyo' date)" >> README.md

    - name: Configure git
      run: |
        git config user.name "${{ env.COMMIT_USER_NAME }}"
        git config user.email "${{ env.COMMIT_USER_EMAIL }}"

    - name: Commit changes
      run: |
        git add README.md
        git commit -m "Auto commit on $(date)" || echo "No changes to commit"

    - name: Pull latest changes and rebase
      run: |
        git pull --rebase origin main

    - name: Push changes
      run: |
        git push origin main
